	<div class="login-container">
	<div class="login-box">
		<h1>เข้าสู่ระบบ</h1>
		<form id="loginForm">
			<div class="input-group">
				<label for="username">ชื่อผู้ใช้</label>
				<input type="text" id="username" placeholder="กรอกชื่อผู้ใช้" required>
                		</div>
			<div class="input-group">
				<label for="password">รหัสผ่าน</label>
				<div class="password-box">
					<input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
                        				<button type="button" id="togglePassword">แสดง</button>
                    			</div>
                		</div>
                		<div class="options">
                    			<label>
                    				<input type="checkbox" id="remember">จดจำฉัน
                    			</label>
                    			<a href="#" id="forgotPassword">ลืมรหัสผ่าน?</a>
                		</div>
			<button type="submit" class="login-btn">เข้าสู่ระบบ</button>
                		<p id="message"></p>
		</form>
		<div class="back-home">
			<a href="index.html">กลับสู่หน้าหลัก</a>
		</div>
	</div>
